name: Health Takt

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write
  actions: read

concurrency:
  group: health-takt
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Observe Bonsai repositories
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/health_check.py

      - name: Persist changed state
        run: |
          if git diff --quiet -- health.json; then
            echo "No health state transition."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add health.json
          git commit -m "chore: update health state"
          git push
